<!DOCTYPE html>
<html>
<head>
    <title>Inscription</title>
    <meta name="UTF-8" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Inscription</h1>

    <form id="formulaire">

        <input type="text" id="username" placeholder="Nom" required>
        <br><br>

        <input type="email" id="email" placeholder="Email" required>
        <br><br>

        <input type="password" id="password" placeholder="Mot de passe" required>
        <br><br>

        <input type="password" id="confirmation" placeholder="Confirmer le mot de passe" required>
        <br><br>

        <button type="submit">Créer mon compte</button>

    </form>

    <p id="message"></p>

    <a href="connexion.html">J'ai déjà un compte</a>

    <script src="inscription.js"></script>

</body>
</html>
