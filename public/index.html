<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Formulaire</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Formulaire</h1>
    <nav>
        <button onclick="page('accueil')">Accueil</button>
        <button onclick="page('connexion')">Connexion</button>
        <button onclick="page('inscription')">Inscription</button>
    </nav>

    <section id="accueil" class="page active">
        <h2>Bienvenue</h2>
        <p>Bienvenue sur notre projet</p>
    </section>

    <section id="inscription" class="page">
        <h2>Inscription</h2>
        <input
            id="nom"
            type="text"
            placeholder="Nom d'utilisateur"
        >
        <input
            id="password"
            type="password"
            placeholder="Mot de passe"
        >
        <button onclick="inscription()">
            S'inscrire
        </button>
        <p id="messageInscription"></p>
    </section>

    <section id="connexion" class="page">
        <h2>Connexion</h2>
        <input
            id="nomConnexion"
            type="text"
            placeholder="Nom d'utilisateur"
        >
        <input
            id="passwordConnexion"
            type="password"
            placeholder="Mot de passe"
        >
        <button onclick="connexion()">
            Se connecter
        </button>
        <p id="messageConnexion"></p>
    </section>

    <section id="profil" class="page">
        <h2>Mon profil</h2>
        <p>
            Nom d'utilisateur :
            <span id="profilNom"></span>
        </p>
        <button onclick="deconnexion()">
            Déconnexion
        </button>
        <button onclick="supprimerCompte()">
            Supprimer mon compte
        </button>
    </section>

    <section id="admin" class="page">
        <h2>Administration</h2>
        <div id="listeUtilisateurs"></div>
        <button onclick="page('profil')">
            Retour au profil
        </button>
    </section>

    <script src="script.js"></script>
</body>
</html>
